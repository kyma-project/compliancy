name: Notify Release Report

on:
  workflow_call:
    inputs:
      release_version:
        required: false
        type: string

jobs:
  dispatch:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Generate token from GitHub App
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.COMPLIANCY_APP_ID_GITHUB_COM }}
          private-key: ${{ secrets.COMPLIANCY_APP_PRIVATE_KEY_GITHUB_COM }}
          owner: kyma-project
          repositories: compliancy

      - name: Send repository_dispatch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -e

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/kyma-project/compliancy/dispatches \
            -d '{
              "event_type": "upload-release-report",
              "client_payload": {
                "repository": "${{ github.repository }}",
                "run_id": "${{ github.run_id }}",
                "workflow": "${{ github.workflow }}",
                "conclusion": "${{ job.status }}",
                "branch": "${{ github.ref_name }}",
                "release_version": "${{ inputs.release_version }}"
              }
            }')
    
          BODY=$(echo "$RESPONSE" | head -n -1)
          STATUS=$(echo "$RESPONSE" | tail -n1)
    
          echo "HTTP Status: $STATUS"
          echo "Response: $BODY"
    
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "repository_dispatch failed"
            exit 1
          fi
          
      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.COMPLIANCY_SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST "$SLACK_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d '{
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":x: *Notify Release Report Failed*\n*Repository:* ${{ github.repository }}\n*Workflow:* ${{ github.workflow }}\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }'
