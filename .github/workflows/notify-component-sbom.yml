name: Notify Component SBOM Upload

on:
  workflow_call:
    inputs:
      component:
        description: "Component slug as registered in kyma/compliancy components.yaml"
        required: true
        type: string
      version:
        description: "Component version to upload SBOM for"
        required: true
        type: string

jobs:
  dispatch:
    runs-on: ubuntu-latest
    environment: prod

    # id-token: write is required to mint the OIDC token that compliancy
    # verifies on github.tools.sap as proof of caller identity.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -e
          if ! [[ "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION'. Expected semver (e.g. 1.2.3, v1.2.3, 1.2.3-rc.1)."
            exit 1
          fi

      - name: Generate Compliancy App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.COMPLIANCY_APP_ID }}
          private-key: ${{ secrets.COMPLIANCY_APP_PRIVATE_KEY }}
          owner: kyma
          repositories: compliancy
          github-api-url: https://github.tools.sap/api/v3

      - name: Debug — verify App token works on github.tools.sap
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set +e
          echo "Token length: ${#GH_TOKEN}"
          echo "Token prefix: ${GH_TOKEN:0:4}..."
          echo
          echo "=== Test 1: github.tools.sap /installation/repositories ==="
          gh api --hostname github.tools.sap /installation/repositories --jq '.repositories[].full_name'
          echo "Exit: $?"
          echo
          echo "=== Test 2: github.tools.sap /repos/kyma/compliancy ==="
          gh api --hostname github.tools.sap /repos/kyma/compliancy --jq '.full_name'
          echo "Exit: $?"
          echo
          echo "=== Test 3: github.com /installation/repositories (sanity — should 401 if token is GHES-scoped) ==="
          gh api /installation/repositories --jq '.repositories[].full_name'
          echo "Exit: $?"
          echo
          echo "=== Test 4: raw curl against github.tools.sap with explicit Bearer ==="
          curl -sS -o /tmp/r.json -w "HTTP %{http_code}\n" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://github.tools.sap/api/v3/repos/kyma/compliancy
          head -c 400 /tmp/r.json; echo
          true

      - name: Mint OIDC token
        id: oidc
        run: |
          set -e
          token=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=compliancy-cumulus-fetch" \
            | jq -r .value)
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "::error::Failed to mint OIDC token"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Send repository_dispatch to kyma/compliancy
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -e
          payload=$(jq -n \
            --arg c "${{ inputs.component }}" \
            --arg v "${{ inputs.version }}" \
            --arg t "$OIDC_TOKEN" \
            '{
              event_type: "upload-component-sbom",
              client_payload: { component: $c, version: $v, oidc_token: $t }
            }')

          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://github.tools.sap/api/v3/repos/kyma/compliancy/dispatches" \
            -d "$payload")

          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n1)

          echo "HTTP Status: $status"
          [ -n "$body" ] && echo "Response: $body"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::repository_dispatch failed (HTTP $status)"
            exit 1
          fi

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST "$SLACK_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d '{
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":x: *Notify Component SBOM Failed*\n*Repository:* ${{ github.repository }}\n*Component:* ${{ inputs.component }}\n*Version:* ${{ inputs.version }}\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }'
