name: Sample Build and Test

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to be released (major.minor.patch)"
      component:
        description: "Component slug as registered in kyma/compliancy components.yaml"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Build
        env:
          CURRENT_RELEASE: ${{ inputs.version }}
        run: |
            echo "Building ${CURRENT_RELEASE}"

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test
        env:
          CURRENT_RELEASE: ${{ inputs.version }}
        run: |
            echo "Testing ${CURRENT_RELEASE}"

  # upload-release-report:
  #   needs: [test]
  #   if: ${{ needs.test.result == 'success' }}
  #   uses: kyma-project/compliancy/.github/workflows/upload-release-report.yml@main
  #   with:
  #     release_version: ${{ inputs.version }}
  #   secrets:
  #    RELEASE_LOG_UPLOADER_SA: ${{ secrets.RELEASE_LOG_UPLOADER_SA }}

  notify:
    needs: test
    if: ${{ needs.test.result == 'success' }}
    uses: kyma-project/compliancy/.github/workflows/notify-release-report.yml@main
    secrets: inherit
    with:
      release_version: ${{ inputs.version }}

  notify-sbom:
    needs: test
    if: ${{ needs.test.result == 'success' }}
    permissions:
      id-token: write
      contents: read
    uses: kyma-project/compliancy/.github/workflows/notify-component-sbom.yml@main
    secrets: inherit
    with:
      component: ${{ inputs.component }}
      version: ${{ inputs.version }}
