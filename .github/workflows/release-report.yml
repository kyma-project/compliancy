name: Release report

on:
  repository_dispatch:
    types: [upload-release-report]

jobs:
  upload-release-report:
    runs-on: ubuntu-latest
    environment: prod

    permissions:
      actions: read
      contents: read
      id-token: write
      
    steps:
      - name: Checkout compliancy
        uses: actions/checkout@v4

      - name: Set release version
        env:
          RAW_RELEASE_VERSION: ${{ github.event.client_payload.release_version }}
        run: |
          set -e
          if [[ -n "$RAW_RELEASE_VERSION" ]] && \
             [[ ! "$RAW_RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$ ]]; then
            echo "::error::Invalid release_version — must be strict semver (e.g. 1.2.3 or 1.2.3-alpha.1)"
            exit 1
          fi
          {
            echo "RELEASE_VERSION<<DELIMITER_RELEASE_VERSION"
            echo "$RAW_RELEASE_VERSION"
            echo "DELIMITER_RELEASE_VERSION"
          } >> "$GITHUB_ENV"
          echo "Release version: $RAW_RELEASE_VERSION"

      - name: Resolve run ID and repository
        env:
          RAW_RUN_ID: ${{ github.event.client_payload.run_id }}
          RAW_REPOSITORY: ${{ github.event.client_payload.repository }}
        run: |
          set -e
          if [[ ! "$RAW_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid run_id — must be a positive integer"
            exit 1
          fi
          if [[ ! "$RAW_REPOSITORY" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ ]]; then
            echo "::error::Invalid repository — must be owner/repo format"
            exit 1
          fi
          {
            echo "RUN_ID<<DELIMITER_RUN_ID"
            echo "$RAW_RUN_ID"
            echo "DELIMITER_RUN_ID"
          } >> "$GITHUB_ENV"
          {
            echo "SOURCE_REPO<<DELIMITER_SOURCE_REPO"
            echo "$RAW_REPOSITORY"
            echo "DELIMITER_SOURCE_REPO"
          } >> "$GITHUB_ENV"
          echo "Source repository: $RAW_REPOSITORY"
          echo "Run ID: $RAW_RUN_ID"

      - name: Verify source repository is allowlisted
        run: |
          set -e
          ALLOWLIST=".github/release-report-allowed-owners.txt"
          if [[ ! -f "$ALLOWLIST" ]]; then
            echo "::error::Allowlist file $ALLOWLIST not found"
            exit 1
          fi
          OWNER="${SOURCE_REPO%%/*}"
          # Match the owner against allowlist entries, ignoring comments and blanks.
          if ! grep -vE '^[[:space:]]*(#|$)' "$ALLOWLIST" | grep -qx "$OWNER"; then
            echo "::error::Source repository '$SOURCE_REPO' is not allowlisted (owner '$OWNER' not in $ALLOWLIST)"
            exit 1
          fi
          echo "Source repository '$SOURCE_REPO' is allowlisted (owner: $OWNER)"

      - name: Wait for workflow completion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Waiting for workflow run $RUN_ID from $SOURCE_REPO to complete..."

          # Wait for the workflow to complete (max 30 minutes)
          timeout=1800
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            status=$(gh api repos/$SOURCE_REPO/actions/runs/$RUN_ID --jq '.status')
            echo "Current status: $status (elapsed: ${elapsed}s)"

            if [ "$status" = "completed" ]; then
              echo "Workflow completed!"
              break
            fi

            sleep 30
            elapsed=$((elapsed + 30))
          done

          if [ $elapsed -ge $timeout ]; then
            echo "::error::Timeout waiting for workflow to complete"
            exit 1
          fi

      - name: Verify source run concluded successfully
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # The dispatch payload is untrusted; read the conclusion from the run
          # itself so a failed/cancelled run cannot be archived as release evidence.
          conclusion=$(gh api repos/$SOURCE_REPO/actions/runs/$RUN_ID --jq '.conclusion')
          echo "Run $RUN_ID conclusion: $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "::error::Refusing to archive run $RUN_ID from $SOURCE_REPO: conclusion '$conclusion' (expected 'success')"
            exit 1
          fi

      - name: Fetch workflow data and create report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching workflow run details for RUN_ID=$RUN_ID from $SOURCE_REPO..."
          gh api repos/$SOURCE_REPO/actions/runs/$RUN_ID > run_summary.json

          echo "Fetching jobs details..."
          gh api repos/$SOURCE_REPO/actions/runs/$RUN_ID/jobs > jobs_summary.json

          echo "Fetching logs from the run (using HTTP/1.1 to avoid goaway errors)..."
          GODEBUG=http2client=0 gh api repos/$SOURCE_REPO/actions/runs/$RUN_ID/logs > logs.zip

          # Extract the logs
          unzip -q logs.zip -d logs/

          # Combine all log files into a single run.log
          find logs/ -name "*.txt" -type f -exec cat {} \; > run.log

          # Clean up extracted logs directory
          rm -rf logs/

          # Extract repo name from full path (e.g., kyma/module-name -> module-name)
          REPO_NAME=$(echo "$SOURCE_REPO" | awk -F'/' '{print $NF}')

          zip "${REPO_NAME}_${RELEASE_VERSION}.zip" \
            run_summary.json \
            jobs_summary.json \
            run.log

          echo "Report created: ${REPO_NAME}_${RELEASE_VERSION}.zip"
  
      # Get the release-log-uploader service account based on the event type.
      # Service account is used to authenticate in GCP.
      - name: Get release-log-uploader gcp service account
        id: get-release-log-uploader-gcp-service-account
        run: |
            echo "RELEASE_LOG_UPLOADER_EMAIL=${{ vars.RELEASE_LOG_UPLOADER_EMAIL }}" >> $GITHUB_OUTPUT

      # Using access-token as it can be used directly as a bearer token.
      - name: Authenticate in GCP
        id: authenticate_in_gcp
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_KYMA_PROJECT_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GH_COM_KYMA_PROJECT_GCP_WORKLOAD_IDENTITY_FEDERATION_PROVIDER }}
          token_format: "access_token"
          request_reason: "${{ github.repository_owner }}/${{ github.repository }}/${{ github.workflow }}/${{ github.run_id }}"
          # service_account is required for the token_format "access_token"
          service_account: ${{ steps.get-release-log-uploader-gcp-service-account.outputs.RELEASE_LOG_UPLOADER_EMAIL }}
  
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_KYMA_PROJECT_PROJECT_ID }}
  
      - name: Upload report to the GCP bucket
        run: |
          # Extract repo name from full path (e.g., kyma/module-name -> module-name)
          REPO_NAME=$(echo "$SOURCE_REPO" | awk -F'/' '{print $NF}')

          gsutil cp "${REPO_NAME}_${RELEASE_VERSION}.zip" gs://kyma_release_test_logs/
          
      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.COMPLIANCY_SLACK_WEBHOOK_URL }}
          RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          payload=$(jq -n \
            --arg source_repo "$SOURCE_REPO" \
            --arg release     "$RELEASE_VERSION" \
            --arg run_id      "$RUN_ID" \
            --arg run_url     "$RUN_URL" \
            '{
              text: "Release Report Workflow Failed",
              blocks: [
                {
                  type: "header",
                  text: {type: "plain_text", text: "Release Report Failed"}
                },
                {
                  type: "section",
                  fields: [
                    {type: "mrkdwn", text: ("*Repository:*\n" + $source_repo)},
                    {type: "mrkdwn", text: ("*Release:*\n"    + $release)},
                    {type: "mrkdwn", text: ("*Source Run:*\n" + $run_id)},
                    {type: "mrkdwn", text: ("*Workflow:*\n<"  + $run_url + "|View Logs>")}
                  ]
                }
              ]
            }')
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$payload"
